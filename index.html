<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6feb">
  <title>Hinário Digital ECC</title>
  <meta name="description" content="Hinário Digital ECC — letras e cifras das músicas, organizadas por dia, com transposição de tom.">
  <link rel="stylesheet" href="assets/styles.css?v=1790352894">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f6feb'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='white'>&#9835;</text></svg>">
</head>
<body>

  <!-- ================= HOME ================= -->
  <div class="home">
    <header class="topo">
      <div class="topo-inner">
        <div class="logo">&#9835;</div>
        <div class="titulo-app">
          <b>Hinário Digital</b>
          <span>ECC</span>
        </div>
        <div class="espaco"></div>
        <button class="icon-btn" id="btn-tema" title="Alternar tema claro/escuro">&#9681;</button>
      </div>
    </header>

    <nav class="tabs" id="tabs"></nav>
    <main class="lista" id="lista"></main>

    <footer class="rodape">
      Hinário Digital ECC · Encontro de Casais com Cristo
    </footer>
  </div>

  <!-- ================= MÚSICA ================= -->
  <section class="musica-view" id="musica-view">
    <div class="mv-topo">
      <div class="mv-topo-inner">
        <button class="mv-voltar" id="btn-voltar">&#8249;&nbsp;Voltar</button>
        <div class="mv-cabecalho">
          <h1 id="mv-titulo">—</h1>
          <div class="subinfo">
            <span class="pill" id="mv-pagina">pág.</span>
            <span class="pill" id="mv-numero">nº</span>
            <span class="pill" id="mv-obs" style="display:none"></span>
          </div>
        </div>
        <button class="mv-toggle" id="btn-editar" title="Editar cifra" aria-label="Editar cifra">&#9998;</button>
        <button class="mv-toggle" id="btn-toggle" title="Mostrar/ocultar controles" aria-label="Mostrar ou ocultar controles">
          <span class="chev">&#9662;</span>
        </button>
      </div>
      <div class="mv-controles" id="mv-controles">
        <div class="mv-controles-inner">
          <div class="grupo-tom">
            <span class="rotulo">TOM</span>
            <button class="ctrl" id="btn-menos" title="Diminuir meio tom">&minus;</button>
            <span class="tom-atual" id="mv-tom">—</span>
            <button class="ctrl" id="btn-mais" title="Aumentar meio tom">+</button>
          </div>
          <button class="ctrl" id="btn-reset" title="Voltar ao tom original">&#8635;</button>
          <span class="sep"></span>
          <button class="ctrl" id="btn-fonte-menos" title="Diminuir letra">A&minus;</button>
          <button class="ctrl" id="btn-fonte-mais" title="Aumentar letra">A+</button>
          <button class="btn-fit" id="btn-fit" title="Encaixar a música inteira na tela">&#8690;<span class="fit-txt">&nbsp;Encaixar</span></button>
        </div>
      </div>
      <div class="editor-bar" id="editor-bar">
        <div class="editor-bar-inner">
          <button id="btn-salvar" class="eb eb-save">&#10003; Salvar</button>
          <button id="btn-cancelar" class="eb eb-cancel">Cancelar</button>
          <button id="btn-restaurar" class="eb eb-restore" title="Voltar ao original">&#8635; Original</button>
          <button id="btn-copiar" class="eb eb-copy" title="Copiar o código desta cifra para enviar/publicar">&#9112; Copiar código</button>
          <span class="eb-hint"><b>2 cliques</b> na nota para editar ali mesmo · 1 toque seleciona (mover/apagar) · toque na <b>letra</b> para adicionar · setas <b>&larr; &rarr;</b> movem, <b>&uarr; &darr;</b> trocam de nota</span>
        </div>
      </div>
    </div>
    <div class="cifra-wrap" id="cifra-wrap">
      <div class="cifra modo-fit" id="cifra"></div>
    </div>

    <!-- navegação entre músicas -->
    <div class="mv-nav" id="mv-nav">
      <button class="navbtn" id="nav-prev" title="Música anterior">&#8249;&nbsp;Anterior</button>
      <span class="nav-atual" id="nav-atual"></span>
      <button class="navbtn" id="nav-next" title="Próxima música">Próxima&nbsp;&#8250;</button>
    </div>

    <!-- barra de ação da nota selecionada -->
    <div class="sel-bar" id="sel-bar">
      <span class="sel-label">Nota:</span>
      <button id="sel-esq" title="Mover para a esquerda">&#9664;</button>
      <button id="sel-dir" title="Mover para a direita">&#9654;</button>
      <button id="sel-editar" title="Trocar acorde">&#9998;</button>
      <button id="sel-apagar" class="perigo" title="Apagar nota">&#128465;</button>
      <button id="sel-ok" class="ok">OK</button>
    </div>
  </section>

  <script src="assets/songs.js?v=1790352894"></script>
  <script src="assets/app.js?v=1790352894"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").then(function (reg) {
        reg.addEventListener("updatefound", function () {
          var nw = reg.installing;
          if (!nw) return;
          nw.addEventListener("statechange", function () {
            // nova versão instalada e já havia um controlador -> recarrega p/ atualizar
            if (nw.state === "installed" && navigator.serviceWorker.controller) {
              location.reload();
            }
          });
        });
      }).catch(function () {});
    }
  </script>
</body>
</html>
